<div class="change-password-container">
    <h2 class="text-center">Change Password</h2>
  
    <div class="form-group">
      <label>Old Password:</label>
      <input type="password" [(ngModel)]="oldPassword" class="form-control">
    </div>
  
    <div class="form-group">
      <label>New Password:</label>
      <input type="password" [(ngModel)]="newPassword" class="form-control">
    </div>
  
    <div class="form-group">
      <label>Confirm New Password:</label>
      <input type="password" [(ngModel)]="confirmPassword" class="form-control">
    </div>
  
    <button class="btn btn-primary mt-3" (click)="changePassword()">Update Password</button>
  
    <!-- ✅ Success & Error Messages -->
    <div *ngIf="successMessage" class="alert alert-success mt-2">{{ successMessage }}</div>
    <div *ngIf="errorMessage" class="alert alert-danger mt-2">{{ errorMessage }}</div>
  
    <!-- ✅ Back to Profile -->
    <div class="text-center mt-3">
      <a [routerLink]="userRole === 'ADMIN' || userRole === 'ROOT_ADMIN' ? '/admin/profile' : '/user/user-profile'">Back to Profile</a>
    </div>
  </div>
