<div class="events-container">
  
    <div *ngIf="successMessage" class="alert alert-success text-center">
      {{ successMessage }}
    </div>
    <div *ngIf="errorMessage" class="alert alert-danger text-center">
      {{ errorMessage }}
    </div>
  
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2>Maintenance Activity</h2>
      <button class="btn global-add-btn" (click)="openModal()">+ Add Event</button>
    </div>
  
    <div class="table-responsive">
      <table class="table table-bordered table-hover global-striped-table">
        <thead class="table-dark">
          <tr>
            <th>Vehicle Number</th>
            <th>Date</th>
            <th>Cost ($)</th>
            <th>Description</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let event of maintenanceEvents">
            <td>{{ event.vehicleNumber }}</td>
            <td><input type="date" [(ngModel)]="event.date" class="form-control" *ngIf="event.isEditing"><span *ngIf="!event.isEditing">{{ event.date }}</span></td>
            <td><input type="number" [(ngModel)]="event.maintenanceCost" class="form-control" *ngIf="event.isEditing"><span *ngIf="!event.isEditing">{{ event.maintenanceCost }}</span></td>
            <td><input type="text" [(ngModel)]="event.maintenanceDescription" class="form-control" *ngIf="event.isEditing"><span *ngIf="!event.isEditing">{{ event.maintenanceDescription }}</span></td>
            <td>
              <button *ngIf="!event.isEditing" class="btn global-edit-btn btn-sm me-1" (click)="toggleEdit(event)">Edit</button>
              <button *ngIf="event.isEditing" class="btn btn-success btn-sm me-1" (click)="updateEvent(event)">Save</button>
              <button *ngIf="event.isEditing" class="btn btn-secondary btn-sm" (click)="cancelEdit(event)">Cancel</button>
              <button *ngIf="!event.isEditing" class="btn btn-danger btn-sm" (click)="deleteEvent(event.id)">Delete</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  
    <div *ngIf="showModal" class="modal-overlay">
      <div class="modal-container">
        <h3 class="text-center">Add Maintenance Event</h3>
        <form>
          <label>Vehicle Number:</label>
          <input type="text" [(ngModel)]="selectedEvent!.vehicleNumber" name="vehicleNumber" class="form-control" required>
          <label>Date:</label>
          <input type="date" [(ngModel)]="selectedEvent!.date" name="date" class="form-control" required>
          <label>Maintenance Cost ($):</label>
          <input type="number" [(ngModel)]="selectedEvent!.maintenanceCost" name="maintenanceCost" class="form-control" required>
          <label>Description:</label>
          <textarea [(ngModel)]="selectedEvent!.maintenanceDescription" name="maintenanceDescription" class="form-control" required></textarea>
          <div *ngIf="modalErrorMessage" class="alert alert-danger mt-2 text-center">{{ modalErrorMessage }}</div>
          <div *ngIf="modalSuccessMessage" class="alert alert-success mt-2 text-center">{{ modalSuccessMessage }}</div>
          <div class="text-center mt-3"><button type="button" class="btn btn-success" (click)="saveEvent()">Add Event</button><button type="button" class="btn btn-secondary ms-2" (click)="closeModal()">Cancel</button></div>
        </form>
      </div>
    </div>
  </div>
