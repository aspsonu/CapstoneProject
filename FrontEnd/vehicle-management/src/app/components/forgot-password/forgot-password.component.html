<div class="container mt-5">
  <div class="card shadow-lg p-4">
    <h2 class="text-center text-primary">Forgot Password</h2>

    <!-- ✅ Progress Bar -->
    <div class="progress mt-3 mb-4">
      <div class="progress-bar progress-bar-striped progress-bar-animated" 
           role="progressbar" 
           [style.width]="step === 1 ? '33%' : step === 2 ? '66%' : '100%'">
      </div>
    </div>

    <!-- ✅ Step 1: Enter User ID -->
    <div *ngIf="step === 1" class="fade-in">
      <form (ngSubmit)="fetchSecurityQuestions()">
        <label for="userId" class="form-label">User ID:</label>
        <input type="text" id="userId" [(ngModel)]="userId" name="userId" class="form-control" required />
        <button type="submit" class="btn btn-primary w-100 mt-3">Next</button>
      </form>
    </div>

    <!-- ✅ Step 2: Answer Security Questions -->
    <div *ngIf="step === 2" class="fade-in">
      <h4 class="text-info">Answer Security Questions</h4>
      <form (ngSubmit)="onVerifyAnswers()">
        <div *ngFor="let question of securityQuestions; let i = index">
          <label class="form-label">{{ question }}</label>
          <input type="text" [(ngModel)]="securityAnswers[question]" name="securityAnswer{{i}}" class="form-control" required />
        </div>
        <button type="submit" class="btn btn-primary w-100 mt-3">Next</button>
      </form>
    </div>

    <!-- ✅ Step 3: Reset Password -->
    <div *ngIf="step === 3" class="fade-in">
      <h4 class="text-success">Reset Password</h4>
      <form (ngSubmit)="onResetPassword()">
        <label for="newPassword" class="form-label">New Password:</label>
        <input type="password" id="newPassword" [(ngModel)]="newPassword" name="newPassword" class="form-control" required />

        <label for="confirmPassword" class="form-label mt-2">Confirm Password:</label>
        <input type="password" id="confirmPassword" [(ngModel)]="confirmPassword" name="confirmPassword" class="form-control" required />

        <button type="submit" class="btn btn-success w-100 mt-3">Reset Password</button>
      </form>
    </div>

    <!-- ✅ Success Message with Countdown -->
    <div *ngIf="message" class="alert alert-success text-center mt-3 fade-in">
      {{ message }} Redirecting in <b>{{ countdown }}</b> seconds...
    </div>

    <!-- ✅ Error Message -->
    <div *ngIf="errorMessage" class="alert alert-danger text-center mt-3 fade-in">
      {{ errorMessage }}
    </div>
  </div>
</div>
